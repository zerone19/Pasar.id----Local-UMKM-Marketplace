<p class="font-body text-on-surface-variant">Lengkapi data diri Anda untuk mulai berbelanja.</p>
</div>
<form class="space-y-5">
<!-- Full Name -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface-variant mb-1 tracking-wider uppercase" for="fullName">Nama Lengkap</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg">person</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body" id="fullName" name="fullName" placeholder="Masukkan nama lengkap" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface-variant mb-1 tracking-wider uppercase" for="email">Alamat Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg">mail</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body" id="email" name="email" placeholder="contoh@email.com" type="email"/>
</div>
</div>
<!-- Phone -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface-variant mb-1 tracking-wider uppercase" for="phone">Nomor HP</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg">phone_iphone</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body" id="phone" name="phone" placeholder="08xx xxxx xxxx" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div>
<label class="block font-label text-sm font-semibold text-on-surface-variant mb-1 tracking-wider uppercase" for="password">Kata Sandi</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg">lock</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body" id="password" name="password" placeholder="Minimal 8 karakter" type="password"/>
</div>
</div>
<div>
<label class="block font-label text-sm font-semibold text-on-surface-variant mb-1 tracking-wider uppercase" for="confirmPassword">Konfirmasi Kata Sandi</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg">lock_reset</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body" id="confirmPassword" name="confirmPassword" placeholder="Ulangi kata sandi" type="password"/>
</div>
</div>
</div>
<!-- T&C Checkbox -->
<div class="flex items-start mt-6">
<div class="flex items-center h-5">
<input class="focus:ring-primary h-5 w-5 text-primary border-outline-variant rounded bg-surface-container-low cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body text-on-surface-variant cursor-pointer" for="terms">
                            Saya setuju dengan <a class="text-primary font-semibold hover:underline" href="#">Syarat &amp; Ketentuan</a> serta <a class="text-primary font-semibold hover:underline" href="#">Kebijakan Privasi</a> Pasar.ID
                        </label>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded bg-primary-container text-on-primary-container font-headline font-semibold hover:bg-primary transition-all active:scale-98 shadow-sm hover:shadow-md text-lg" type="submit">
                        Daftar Sekarang
                    </button>
</div>
</form>
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Daftar dengan Google

</div>
